name: Deploy Prod

on:
  push:
    branches:
      - Prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    # Give Mix + composer enough time on the 2 vCPU box.
    timeout-minutes: 25
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/ubuntu/minera"
            cd "$APP_DIR"
            sudo -n git config --global --add safe.directory "$APP_DIR" || true
            sudo -n git fetch origin Prod
            sudo -n git checkout Prod
            sudo -n git reset --hard origin/Prod
            sudo -n bash "$APP_DIR/scripts/deploy.sh"
