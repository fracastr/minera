name: Deploy v2

on:
  push:
    branches:
      - next
  workflow_dispatch:

# One deploy at a time on the box (shared with Deploy Prod); never cancel one mid-build.
concurrency:
  group: deploy-box
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    # Give the web/ build + composer enough time on the 2 vCPU box.
    timeout-minutes: 25
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/ubuntu/minera-v2"
            cd "$APP_DIR"
            sudo -n git config --global --add safe.directory "$APP_DIR" || true
            sudo -n git fetch origin next
            sudo -n git checkout next
            sudo -n git reset --hard origin/next
            sudo -n env APP_DIR="$APP_DIR" bash "$APP_DIR/scripts/deploy.sh"
