name: CI

on:
  pull_request:
  push:
    branches:
      - Prod
      - Develop
      - NewDevelop

jobs:
  php:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, bcmath, gd, zip, pdo_mysql, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite=Unit

  web:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Unit tests
        run: npx vitest run
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1 # vitest starts a Vite server; laravel-vite-plugin refuses that under CI=true

      - name: Build (into public/app-build)
        run: npx vite build

  excel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Root package.json only holds xlsx-populate for public/Export (the server runs it on Node 10).
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Excel export test
        run: node public/Export/addImages.test.js
