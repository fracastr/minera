<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo circular con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7367f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5e50ee;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Círculo de fondo -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="1"/>

  <!-- Gráfico de barras -->
  <!-- Barra 1 -->
  <rect x="10" y="18" width="2" height="6" fill="#ffffff" rx="1"/>

  <!-- Barra 2 -->
  <rect x="13" y="16" width="2" height="8" fill="#ffffff" rx="1"/>

  <!-- Barra 3 -->
  <rect x="16" y="14" width="2" height="10" fill="#ffffff" rx="1"/>

  <!-- Barra 4 -->
  <rect x="19" y="12" width="2" height="12" fill="#ffffff" rx="1"/>

  <!-- Barra 5 -->
  <rect x="22" y="15" width="2" height="9" fill="#ffffff" rx="1"/>
</svg>
